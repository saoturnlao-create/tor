<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คูปองส่วนลดพิเศษ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    @keyframes pulse-border {
      0% { border-color: #ef4444; }
      50% { border-color: #3b82f6; }
      100% { border-color: #ef4444; }
    }
    .active-ticket { animation: pulse-border 2s infinite; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden text-center p-6">
    <div id="loading" class="py-10">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-green-500 mx-auto"></div>
      <p id="loading-txt" class="mt-4 text-gray-700 font-medium text-sm">กำลังเชื่อมต่อ LINE...</p>
    </div>

    <div id="content" class="hidden">
      <div class="flex items-center justify-center gap-3 mb-6">
        <img id="user-picture" class="w-12 h-12 rounded-full border-2 border-green-500 bg-gray-200" src="" alt="Profile">
        <div class="text-left">
          <p class="text-xs text-gray-500">ยินดีต้อนรับ</p>
          <p id="user-name" class="font-bold text-gray-800 text-sm"></p>
        </div>
      </div>

      <!-- State 1: Claim -->
      <div id="claim-view" class="hidden">
        <div class="bg-green-50 border border-green-200 rounded-xl p-6 mb-6">
          <h2 class="text-xl font-bold text-green-700 mb-2">🎁 สิทธิ์ส่วนลดประจำวัน</h2>
          <p class="text-gray-600 text-sm">กดรับสิทธิ์เพื่อนำไปแสดงต่อพนักงานตอนชำระเงิน (1 สิทธิ์ / ท่าน / วัน)</p>
        </div>
        <button onclick="handleClaim()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition duration-200">
          กดรับคูปองส่วนลด
        </button>
      </div>

      <!-- State 2: Ticket -->
      <div id="ticket-view" class="hidden">
        <div class="border-4 rounded-2xl p-6 mb-6 bg-white relative active-ticket" id="ticket-box">
          <span id="ticket-badge" class="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-green-500 text-white text-xs px-3 py-1 rounded-full font-bold">
            ใช้งานได้วันนี้เท่านั้น
          </span>
          <h3 class="text-gray-500 text-sm mt-2 font-medium">รหัสส่วนลดของคุณ</h3>
          <p id="ticket-code" class="text-3xl font-black text-gray-800 tracking-wider my-3"></p>
          <p class="text-xs text-gray-400">วันที่: <span id="ticket-date"></span></p>
          <div class="mt-4 pt-4 border-t border-dashed border-gray-300">
            <p class="text-xs text-amber-600 font-medium">⚠️ แสดงหน้าจอนี้ให้พนักงานตอนเช็คบิล</p>
          </div>
        </div>

        <button id="staff-btn" onclick="handleStaffRedeem()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-3 px-4 rounded-xl text-sm transition duration-200">
          🔒 สำหรับพนักงานกดตัดสิทธิ์ (Staff Only)
        </button>
      </div>
    </div>
  </div>

  <script>
    const LIFF_ID = "2011285020-V51sLoQy";
    // นำ URL Web App จากข้อ 2 มาวางตรงนี้
    const API_URL = "วาง_WEB_APP_URL_จาก_APPS_SCRIPT_ตรงนี้";
    let currentUser = null;

    async function callApi(payload) {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    async function initialize() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        currentUser = await liff.getProfile();
        document.getElementById('user-picture').src = currentUser.pictureUrl || 'https://via.placeholder.com/150';
        document.getElementById('user-name').innerText = currentUser.displayName;

        document.getElementById('loading-txt').innerText = "กำลังตรวจสอบสิทธิ์...";
        const res = await callApi({ action: "checkStatus", userId: currentUser.userId });
        renderView(res);

      } catch (err) {
        Swal.fire('Error', err.message, 'error');
      }
    }

    function renderView(res) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');

      if (!res.alreadyClaimed) {
        document.getElementById('claim-view').classList.remove('hidden');
        document.getElementById('ticket-view').classList.add('hidden');
      } else {
        document.getElementById('claim-view').classList.add('hidden');
        document.getElementById('ticket-view').classList.remove('hidden');
        
        document.getElementById('ticket-code').innerText = res.couponCode;
        document.getElementById('ticket-date').innerText = res.date;

        if (res.status === 'USED') {
          const badge = document.getElementById('ticket-badge');
          badge.innerText = 'ใช้สิทธิ์แล้ว';
          badge.className = 'absolute -top-3 left-1/2 transform -translate-x-1/2 bg-gray-500 text-white text-xs px-3 py-1 rounded-full font-bold';
          
          const box = document.getElementById('ticket-box');
          box.classList.remove('active-ticket');
          box.classList.add('border-gray-300', 'bg-gray-50', 'opacity-75');

          const btn = document.getElementById('staff-btn');
          btn.disabled = true;
          btn.innerText = '✓ ตัดสิทธิ์เรียบร้อยแล้ว';
          btn.className = 'w-full bg-gray-300 text-gray-500 font-medium py-3 px-4 rounded-xl text-sm cursor-not-allowed';
        }
      }
    }

    async function handleClaim() {
      const result = await Swal.fire({
        title: 'ยืนยันการรับสิทธิ์?',
        text: 'คูปองจะใช้ได้เฉพาะวันนี้เท่านั้น',
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#22c55e',
        confirmButtonText: 'รับสิทธิ์เลย',
        cancelButtonText: 'ยกเลิก'
      });

      if (result.isConfirmed) {
        Swal.showLoading();
        const res = await callApi({ action: "claimCoupon", userId: currentUser.userId, displayName: currentUser.displayName });
        if (res.success) {
          Swal.fire('สำเร็จ!', 'รับคูปองส่วนลดเรียบร้อย', 'success');
          renderView({ alreadyClaimed: true, couponCode: res.couponCode, status: res.status, date: res.date });
        } else {
          Swal.fire('แจ้งเตือน', res.message, 'warning');
        }
      }
    }

    async function handleStaffRedeem() {
      const result = await Swal.fire({
        title: 'สำหรับพนักงาน',
        input: 'password',
        inputLabel: 'กรุณากรอกรหัส PIN พนักงาน (4 หลัก)',
        inputPlaceholder: 'PIN',
        inputAttributes: { maxlength: 4, autofocus: 'autofocus' },
        showCancelButton: true,
        confirmButtonColor: '#1e293b',
        confirmButtonText: 'ยืนยันตัดสิทธิ์',
        cancelButtonText: 'ยกเลิก'
      });

      if (result.isConfirmed && result.value) {
        Swal.showLoading();
        const res = await callApi({ action: "redeemCoupon", userId: currentUser.userId, pin: result.value });
        if (res.success) {
          Swal.fire('สำเร็จ!', res.message, 'success');
          const statusRes = await callApi({ action: "checkStatus", userId: currentUser.userId });
          renderView(statusRes);
        } else {
          Swal.fire('ผิดพลาด', res.message, 'error');
        }
      }
    }

    window.onload = initialize;
  </script>
</body>
</html>
